[project]
name = "faultline"
version = "0.1.0"
description = "Evaluate tool-using agents when APIs drift, using final database state."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp==2.3.0", "litellm>=1.80,<2", "python-dotenv>=1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
faultline = "faultline.cli:main"
faultline-server = "faultline.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
